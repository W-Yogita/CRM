<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Details - Support CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <!-- Navigation Header -->
    <nav class="bg-white border-b border-slate-200 px-8 py-4 shadow-sm flex items-center justify-between">
        <a href="/" class="text-blue-600 hover:text-blue-700 font-medium flex items-center gap-2">
            &larr; Back to Dashboard
        </a>
        <h1 class="text-xl font-bold text-slate-900">Ticket Details</h1>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto my-8 px-4">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-6">
            
            <!-- Ticket Header Info -->
            <div class="border-b border-slate-100 pb-4 flex justify-between items-start">
                <div>
                    <h2 id="ticketSubject" class="text-2xl font-bold text-slate-900">Loading...</h2>
                    <p class="text-sm text-slate-500 mt-1">
                        Submitted by <span id="customerName" class="font-semibold text-slate-700">-</span> 
                        (<span id="customerEmail" class="text-slate-600">-</span>)
                    </p>
                </div>
            </div>

            <!-- Description -->
            <div>
                <h3 class="text-xs uppercase font-bold text-slate-400 tracking-wider mb-2">Description</h3>
                <p id="ticketDescription" class="text-slate-700 leading-relaxed bg-slate-50 p-4 rounded-lg border border-slate-100 whitespace-pre-line">
                    Loading description...
                </p>
            </div>

            <!-- Update Status & Add Note Section -->
            <div class="border-t border-slate-100 pt-6 space-y-4">
                <h3 class="text-sm font-bold text-slate-800">Update Ticket Status & Notes</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Status</label>
                        <select id="statusSelect" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="Open">Open</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Closed">Closed</option>
                        </select>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Add Note / Activity Update</label>
                        <input type="text" id="noteInput" placeholder="Enter internal note or status details..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <button onclick="updateStatusAndNotes()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg shadow-sm transition-colors">
                    Save Updates
                </button>
            </div>

            <!-- Notes Activity Timeline -->
            <div class="border-t border-slate-100 pt-6">
                <h3 class="text-xs uppercase font-bold text-slate-400 tracking-wider mb-4">Activity Timeline & Internal Notes</h3>
                <div id="notesTimeline" class="space-y-3">
                    <p class="text-sm text-slate-400 italic">No notes added yet.</p>
                </div>
            </div>

        </div>
    </main>

    <!-- JavaScript logic wrapped cleanly inside script tags -->
    <script>
        const ticketId = window.location.pathname.split('/').pop();

        async function loadTicket() {
            try {
                const response = await fetch(`/api/tickets/${ticketId}`);
                if (!response.ok) {
                    alert("Ticket not found!");
                    window.location.href = '/';
                    return;
                }
                const ticket = await response.json();
                
                if (document.getElementById('ticketSubject')) document.getElementById('ticketSubject').innerText = ticket.subject;
                if (document.getElementById('ticketDescription')) document.getElementById('ticketDescription').innerText = ticket.description;
                if (document.getElementById('customerName')) document.getElementById('customerName').innerText = ticket.customer_name;
                if (document.getElementById('customerEmail')) document.getElementById('customerEmail').innerText = ticket.customer_email;
                if (document.getElementById('statusSelect')) document.getElementById('statusSelect').value = ticket.status;

                const notesContainer = document.getElementById('notesTimeline');
                if (notesContainer && ticket.notes && ticket.notes.length > 0) {
                    notesContainer.innerHTML = ticket.notes.map(n => `
                        <div class="bg-slate-50 border-l-4 border-blue-500 p-3 rounded-r-lg">
                            <p class="text-sm text-slate-800">${n.note_text}</p>
                            <span class="text-xs text-slate-400 mt-1 block">${new Date(n.created_at).toLocaleString()}</span>
                        </div>
                    `).join('');
                } else if (notesContainer) {
                    notesContainer.innerHTML = `<p class="text-sm text-slate-400 italic">No internal notes added yet.</p>`;
                }
            } catch (err) {
                console.error("Error loading ticket:", err);
            }
        }

        async function updateStatusAndNotes() {
            const newStatus = document.getElementById('statusSelect') ? document.getElementById('statusSelect').value : null;
            const noteText = document.getElementById('noteInput') ? document.getElementById('noteInput').value : null;

            const response = await fetch(`/api/tickets/${ticketId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus, note_text: noteText })
            });

            if (response.ok) {
                alert("Ticket updated successfully!");
                if (document.getElementById('noteInput')) document.getElementById('noteInput').value = '';
                loadTicket();
            } else {
                alert("Failed to update ticket.");
            }
        }

        document.addEventListener('DOMContentLoaded', loadTicket);
    </script>
</body>
</html>
