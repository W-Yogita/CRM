<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Ticket - Datastraw Support CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-8">
  <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-slate-900">Create New Support Ticket</h1>
      <a href="/" class="text-sm font-semibold text-blue-600 hover:underline">← Back to Dashboard</a>
    </div>

    <form onsubmit="handleFormSubmit(event)" class="space-y-5">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Customer Name</label>
        <input type="text" id="customerName" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. John Doe">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Customer Email</label>
        <input type="email" id="customerEmail" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="john@example.com">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Subject</label>
        <input type="text" id="subject" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. Urgent refund requested for broken payment">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Description</label>
        <textarea id="description" rows="4" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Provide full details about the issue..."></textarea>
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition shadow-md shadow-blue-500/20">
        Submit Ticket & Run Auto-Triage
      </button>
    </form>
  </div>

  <script>
    async function handleFormSubmit(event) {
      event.preventDefault(); // Prevents page reload

      const payload = {
        customer_name: document.getElementById('customerName').value,
        customer_email: document.getElementById('customerEmail').value,
        subject: document.getElementById('subject').value,
        description: document.getElementById('description').value
      };

      try {
        const response = await fetch('/api/tickets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          window.location.href = '/'; // Redirect back to Dashboard
        } else {
          const errData = await response.json();
          alert(`Error creating ticket: ${errData.detail || 'Please check input fields.'}`);
        }
      } catch (err) {
        console.error("Form submission failed:", err);
      }
    }
  </script>
</body>
</html>
