<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datastraw Support CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Top Header Bar -->
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold text-slate-900">Support CRM Dashboard</h1>
        <p class="text-sm text-slate-500">Auto-triage enabled customer support desk</p>
      </div>
      <a href="/create" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2.5 rounded-xl transition shadow-sm shadow-blue-500/20 text-sm">
        + Create Ticket
      </a>
    </div>

    <!-- Live Stats Bar -->
    <div class="grid grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Tickets</p>
        <p id="statTotal" class="text-2xl font-bold text-slate-900 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Open</p>
        <p id="statOpen" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">In Progress</p>
        <p id="statProgress" class="text-2xl font-bold text-amber-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Closed</p>
        <p id="statClosed" class="text-2xl font-bold text-slate-400 mt-1">0</p>
      </div>
    </div>

    <!-- Main Table Container -->
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
      
      <!-- Search Input -->
      <div class="p-4 border-b border-slate-100 bg-slate-50/50">
        <input type="text" id="searchInput" oninput="loadTickets()" placeholder="Search by customer, subject, or ID..." class="w-full max-w-sm px-4 py-2 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
      </div>

      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-50 border-b border-slate-100 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            <th class="py-3.5 px-6">ID</th>
            <th class="py-3.5 px-6">Customer</th>
            <th class="py-3.5 px-6">Subject</th>
            <th class="py-3.5 px-6">Status & Triage</th>
            <th class="py-3.5 px-6">Created</th>
            <th class="py-3.5 px-6 text-right">Action</th>
          </tr>
        </thead>
        <tbody id="ticketsTable" class="divide-y divide-slate-100 text-sm">
          <tr>
            <td colspan="6" class="py-8 text-center text-slate-400 font-medium">Loading tickets...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    async function loadTickets() {
      const searchInput = document.getElementById('searchInput');
      const search = searchInput ? searchInput.value : '';

      let url = '/api/tickets?';
      if (search) {
        url += `search=${encodeURIComponent(search)}`;
      }

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Failed to load backend tickets");
        const tickets = await response.json();

        const tbody = document.getElementById('ticketsTable');
        if (!tbody) return;

        tbody.innerHTML = '';

        // Update Stat Counters
        if (document.getElementById('statTotal')) {
          document.getElementById('statTotal').innerText = tickets.length;
          document.getElementById('statOpen').innerText = tickets.filter(t => t.status === 'Open').length;
          document.getElementById('statProgress').innerText = tickets.filter(t => t.status === 'In Progress').length;
          document.getElementById('statClosed').innerText = tickets.filter(t => t.status === 'Closed').length;
        }

        if (!tickets || tickets.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="py-8 text-center text-slate-400 font-medium">
                No support tickets found. Click "+ Create Ticket" to add one.
              </td>
            </tr>`;
          return;
        }

        // Render Rows
        tickets.forEach(ticket => {
          let statusStyle = ticket.status === 'Open' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                            ticket.status === 'In Progress' ? 'bg-amber-50 text-amber-700 border-amber-200' :
                            'bg-slate-100 text-slate-600 border-slate-200';

          let urgencyStyle = ticket.urgency === 'Critical' ? 'bg-red-50 text-red-700 border-red-200' :
                             ticket.urgency === 'High' ? 'bg-orange-50 text-orange-700 border-orange-200' :
                             'bg-slate-100 text-slate-600 border-slate-200';

          const dateStr = ticket.created_at 
            ? new Date(ticket.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) 
            : 'N/A';

          tbody.innerHTML += `
            <tr class="hover:bg-slate-50/80 transition">
              <td class="py-4 px-6 font-bold text-blue-600">${ticket.ticket_id}</td>
              <td class="py-4 px-6 font-semibold text-slate-900">${ticket.customer_name}</td>
              <td class="py-4 px-6 text-slate-600 max-w-xs truncate">${ticket.subject}</td>
              <td class="py-4 px-6">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="px-2.5 py-0.5 rounded-full text-xs font-bold border ${statusStyle}">
                    ${ticket.status}
                  </span>
                  <span class="px-2 py-0.5 rounded text-xs font-semibold border ${urgencyStyle}">
                    ${ticket.urgency || 'Normal'}
                  </span>
                  <span class="px-2 py-0.5 rounded text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-100">
                    ${ticket.category || 'General'}
                  </span>
                </div>
              </td>
              <td class="py-4 px-6 text-slate-400 text-xs">${dateStr}</td>
              <td class="py-4 px-6 text-right">
                <a href="/ticket/${ticket.ticket_id}" class="text-blue-600 font-semibold hover:text-blue-800 hover:underline text-xs bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100 transition">
                  Open Ticket →
                </a>
              </td>
            </tr>
          `;
        });
      } catch (err) {
        console.error("Failed to fetch tickets:", err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadTickets);
  </script>
</body>
</html>
